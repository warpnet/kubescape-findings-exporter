---
# No release commit: main is protected. The tag is the version; the workflow writes it into the chart at
# packaging time (helm package --version --app-version), so chart X.Y.Z always ships image X.Y.Z.
branches:
  - main
plugins:
  # conventionalcommits, not the default angular preset: angular ignores "feat!:".
  - - '@semantic-release/commit-analyzer'
    - preset: conventionalcommits
      releaseRules:
        # Renovate bumps release; other chores do not.
        - type: chore
          scope: deps
          release: patch
  - - '@semantic-release/release-notes-generator'
    - preset: conventionalcommits
  - '@semantic-release/github'
