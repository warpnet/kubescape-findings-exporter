# Read-only access to Kubescape's scan results, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}
  namespace: {{ include "kce.kubescapeNamespace" . }}
  labels:
    {{- include "kce.labels" . | nindent 4 }}
rules:
  - apiGroups: [spdx.softwarecomposition.kubescape.io]
    resources: [vulnerabilitymanifests]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
  namespace: {{ include "kce.kubescapeNamespace" . }}
  labels:
    {{- include "kce.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
